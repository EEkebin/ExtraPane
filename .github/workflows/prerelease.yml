name: Build and release
on:
  # Every pushed branch gets versioned Windows/Linux/Android/macOS builds as run
  # artifacts (scripts/deliver-dev-build.ps1 installs them). Their checks also
  # appear on pull requests through the commit. Only merged PRs on main publish.
  push:
    branches: ['**']
  workflow_dispatch:
    inputs:
      resource_platforms_only:
        description: Validate Linux and Android together (never publishes a release)
        type: boolean
        default: false
      macos_only:
        description: Validate macOS only (never publishes a release)
        type: boolean
        default: false
      android_only:
        description: Validate Android only (never publishes a release)
        type: boolean
        default: false
      linux_only:
        description: Validate Linux only (never publishes a release)
        type: boolean
        default: false
      channel:
        description: Release channel (merged PRs always create prereleases)
        type: choice
        options: [pre, stable]
        default: pre
      title:
        description: Stable release name, e.g. The Elbow Room Update
        type: string
      explanation:
        description: Stable release name explanation (define any unusual word)
        type: string
      revision:
        description: Same-day stable revision (0 for first, then 2, 3, ...)
        default: '0'
        type: string
permissions:
  actions: read
  contents: read
  pull-requests: read
concurrency:
  group: release-${{ github.ref }}-${{ github.event_name }}-${{ inputs.macos_only && 'macos' || inputs.android_only && 'android' || inputs.resource_platforms_only && 'resources' || inputs.linux_only && 'linux' || 'all' }}
  # A newer push to the same feature branch supersedes its older build; main is never cancelled.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
jobs:
  metadata:
    runs-on: windows-2025
    timeout-minutes: 10
    outputs:
      version: ${{ steps.metadata.outputs.version }}
      numeric: ${{ steps.metadata.outputs.numeric }}
      publish: ${{ steps.metadata.outputs.publish }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'
      - name: Release metadata
        id: metadata
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_CHANNEL: ${{ inputs.channel }}
          RELEASE_TITLE: ${{ inputs.title }}
          RELEASE_EXPLANATION: ${{ inputs.explanation }}
          RELEASE_REVISION: ${{ inputs.revision }}
        run: |
          python -m unittest discover -s tests -p test_release_version.py
          if($LASTEXITCODE -ne 0){throw 'Release version tests failed'}
          python -m unittest discover -s tests -p test_publish_release.py
          if($LASTEXITCODE -ne 0){throw 'Release artifact tests failed'}
          $run=gh api "repos/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID" | ConvertFrom-Json
          if($LASTEXITCODE -ne 0){throw 'Cannot read workflow creation date'}
          $env:RELEASE_DATE=([DateTimeOffset]::Parse($run.created_at)).UtcDateTime.ToString('yyyy-MM-dd')
          python scripts/release_version.py --metadata
          if($LASTEXITCODE -ne 0){throw 'Invalid release metadata'}
          $publish=$false
          if('${{ github.event_name }}' -eq 'workflow_dispatch' -and '${{ github.ref }}' -eq 'refs/heads/main'){$publish=$true}
          # Feature branches never publish, even when they point at a merged main commit.
          if('${{ github.event_name }}' -eq 'push' -and '${{ github.ref }}' -eq 'refs/heads/main'){
            $prs=gh api "repos/$env:GITHUB_REPOSITORY/commits/$env:GITHUB_SHA/pulls" | ConvertFrom-Json
            if($LASTEXITCODE -ne 0){throw 'Cannot verify merged PR'}
            $publish=@($prs | Where-Object {$_.merged_at -and $_.base.ref -eq 'main' -and $_.merge_commit_sha -eq $env:GITHUB_SHA}).Count -gt 0
          }
          if('${{ inputs.resource_platforms_only }}' -eq 'true'){$publish=$false}
          "publish=$($publish.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: release-metadata
          path: release-metadata.json
          if-no-files-found: error
  build:
    needs: metadata
    if: inputs.resource_platforms_only != true && inputs.linux_only != true && inputs.android_only != true && inputs.macos_only != true
    uses: ./.github/workflows/windows-shared.yml
    with:
      version: ${{ needs.metadata.outputs.version }}
  linux:
    needs: metadata
    if: inputs.android_only != true && inputs.macos_only != true
    uses: ./.github/workflows/linux-appimage.yml
    with:
      version: ${{ needs.metadata.outputs.version }}
  android:
    needs: metadata
    if: inputs.linux_only != true && inputs.macos_only != true
    uses: ./.github/workflows/android.yml
    with:
      version: ${{ needs.metadata.outputs.version }}
      sign: ${{ github.event_name != 'pull_request' }}
    secrets:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
  macos:
    needs: metadata
    if: inputs.resource_platforms_only != true && inputs.linux_only != true && inputs.android_only != true
    uses: ./.github/workflows/macos.yml
    with:
      version: ${{ needs.metadata.outputs.version }}
  publish:
    needs: [metadata, build, linux, android, macos]
    if: needs.metadata.outputs.publish == 'true' && inputs.resource_platforms_only != true && inputs.linux_only != true && inputs.android_only != true && inputs.macos_only != true
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8.0.2
        with:
          name: ExtraPane-${{ needs.metadata.outputs.version }}
          path: dist
      - uses: actions/download-artifact@v8.0.2
        with:
          name: ExtraPane-Linux-${{ needs.metadata.outputs.version }}
          path: dist
      - uses: actions/download-artifact@v8.0.2
        with:
          name: ExtraPane-Android-${{ needs.metadata.outputs.version }}
          path: dist
      - uses: actions/download-artifact@v8.0.2
        with:
          name: ExtraPane-macOS-${{ needs.metadata.outputs.version }}
          path: dist
      - name: Publish release
        # All platform artifacts must be present before publication.
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          python3 scripts/publish_release.py

name: Format
on:
  push:
    branches: ['**']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: format-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v6.2.0
        with:
          distribution: temurin
          java-version: '21'
      - name: Install pinned formatters
        # Same clang-format as Visual Studio 18's bundled LLVM, and the app's Qt for qmlformat.
        run: |
          python -m pip install clang-format==22.1.3 aqtinstall==3.3.0
          python -m aqt install-qt linux desktop 6.8.3 linux_gcc_64 -O out/qt-sdk
      - name: Check formatting
        env:
          QMLFORMAT: out/qt-sdk/6.8.3/gcc_64/bin/qmlformat
        run: python scripts/format.py --check

name: Windows shared-resource packages
on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
permissions:
  contents: read
jobs:
  packages:
    runs-on: windows-2025
    timeout-minutes: 60
    env:
      EXTRAPANE_VERSION: ${{ inputs.version }}
      CARGO_TARGET_DIR: ${{ github.workspace }}/out/microphone-endpoint
      DOTNET_GENERATE_ASPNET_CERTIFICATE: 'false'
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.403'
      - uses: actions/download-artifact@v4
        with:
          name: release-metadata
          path: .
      - name: Restore pinned Qt and Rust build tools
        shell: pwsh
        run: |
          python -m pip install aqtinstall==3.3.0
          if($LASTEXITCODE){throw 'Qt downloader setup failed'}
          python -m aqt install-qt windows desktop 6.8.3 win64_msvc2022_64 -O out/qt-sdk -m qtshadertools qtimageformats
          if($LASTEXITCODE){throw 'Qt SDK restore failed'}
          rustup toolchain install 1.88.0 --profile minimal
          if($LASTEXITCODE){throw 'Rust toolchain restore failed'}
      - name: Build native components and shared UI
        shell: pwsh
        run: ./scripts/build-shared-windows-ci.ps1
      - name: Stage and verify portable app and installer
        shell: pwsh
        run: |
          ./scripts/package-shared-windows.ps1 -IncludeCamera -IncludeMicrophone -IncludeUsb
          ./scripts/stage-driver-component.ps1 -Stage "$pwd/out/shared-portable"
          python scripts/package_shared_windows.py
          if($LASTEXITCODE){throw 'Shared Windows artifact verification failed'}
          Copy-Item release-metadata.json out/dist/release-metadata.json
      - uses: actions/upload-artifact@v4
        with:
          name: ExtraPane-${{ inputs.version }}
          path: |
            out/dist/release-metadata.json
            out/dist/ExtraPane-${{ inputs.version }}-*.zip
            out/dist/ExtraPane-${{ inputs.version }}-*.exe
            out/dist/SHA256SUMS.txt
          if-no-files-found: error

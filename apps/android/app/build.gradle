plugins { id 'com.android.application' }
def releaseName = System.getenv('EXTRAPANE_VERSION') ?: '2026.11.03-pre.0'
android {
    namespace 'io.github.eekebin.extrapane'
    compileSdk 36
    buildToolsVersion '35.0.0'
    ndkVersion '27.2.12479018'
    defaultConfig {
        applicationId 'io.github.eekebin.extrapane'
        minSdk 30
        targetSdk 36
        versionCode 1
        versionName releaseName
        testInstrumentationRunner 'io.github.eekebin.extrapane.ProtocolChecks'
        ndk { abiFilters 'arm64-v8a', 'x86_64' }
        externalNativeBuild { cmake { cppFlags '-std=c++20'; arguments '-DANDROID_SUPPORT_FLEXIBLE_PAGE_SIZES=ON' } }
    }
    buildFeatures { buildConfig true }
    externalNativeBuild { cmake { path '../native/CMakeLists.txt'; version '3.22.1' } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
